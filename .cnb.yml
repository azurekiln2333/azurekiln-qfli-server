# CI for the standalone business backend repository.
# Validation and publishing both live in scripts/ci-common.mjs, so CNB,
# GitHub Actions and GitLab CI cannot drift apart.
#
# Image namespace follows the CNB rule docker.cnb.cool/${CNB_REPO_SLUG_LOWERCASE}/<name>,
# which gives docker.cnb.cool/azurekiln/azurekiln-qfli-server/qfli-server.
#
# Every job here runs `node`, so every job pins node:24.15.0-bookworm. The CNB
# default build image has no Node and fails with `node: command not found`.
#
# `services: [docker]` injects a Docker daemon and runs `docker login` against
# docker.cnb.cool for the current repository, so the publish steps pass
# --no-login. CNB defines CNB_TOKEN, not CI_REGISTRY_PASSWORD, so a manual
# login from this file would have no password to read.
# The deployment contract check reads docker-compose.yaml as text, so no
# Compose CLI is needed here; only Node and, for publish, the docker client.
# Pull requests validate only; they never push images.

main:
  push:
    - name: verify
      docker: &node-runtime
        image: node:24.15.0-bookworm
      stages:
        - name: unit-tests
          script: node scripts/ci-common.mjs verify

    - name: publish-image
      docker: *node-runtime
      services:
        - docker
      stages:
        - name: build-and-push
          script: >-
            node scripts/ci-common.mjs publish
            --platform cnb
            --ref "refs/heads/${CNB_BRANCH}"
            --revision "$CNB_COMMIT"
            --repository "$CNB_REPO_SLUG_LOWERCASE"
            --no-login

  pull_request:
    - name: verify-pull-request
      docker: *node-runtime
      stages:
        - name: unit-tests
          script: node scripts/ci-common.mjs verify

"v*":
  tag_push:
    - name: publish-release-image
      docker: *node-runtime
      services:
        - docker
      stages:
        - name: build-and-push-tag
          script: >-
            node scripts/ci-common.mjs publish
            --platform cnb
            --ref "refs/tags/${CNB_BRANCH}"
            --revision "$CNB_COMMIT"
            --repository "$CNB_REPO_SLUG_LOWERCASE"
            --no-login
