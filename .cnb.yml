# CI for the standalone business backend repository.
# Validation and publishing both live in scripts/ci-common.mjs, so CNB,
# GitHub Actions and GitLab CI cannot drift apart.
#
# Image namespace follows the CNB rule docker.cnb.cool/${CNB_REPO_SLUG_LOWERCASE}/<name>,
# which gives docker.cnb.cool/azurekiln/azurekiln-qfli-server/qfli-server.
# `services: [docker]` logs in automatically on trusted push/tag pipelines and
# the build environment already provides CI_REGISTRY_USER/CI_REGISTRY_PASSWORD.
# Pull requests validate only; they never push images.
#
# The CNB docker service must mount `ci-common` from the build environment
# (Docker Hub is required for the base image). Set CI_COMMIT_AUTHOR, or verify
# this file against the CNB console before relying on it for a release.

main:
  push:
    - name: verify
      docker: &node-runtime
        image: node:24.15.0-bookworm
      stages:
        - name: unit-tests
          script: node scripts/ci-common.mjs verify
    - name: publish-image
      docker:
        image: cnbcool/default-dev-env:latest
      services:
        - docker
      stages:
        - name: build-and-push
          script: >-
            node scripts/ci-common.mjs publish
            --platform cnb
            --ref "$CNB_BRANCH_REF"
            --revision "$CNB_COMMIT"
            --repository "$CNB_REPO_SLUG_LOWERCASE"

  pull_request:
    - name: verify-pull-request
      docker: *node-runtime
      stages:
        - name: unit-tests
          script: node scripts/ci-common.mjs verify

"v*":
  tag_push:
    - name: publish-release-image
      docker:
        image: cnbcool/default-dev-env:latest
      services:
        - docker
      stages:
        - name: build-and-push-tag
          script: >-
            node scripts/ci-common.mjs publish
            --platform cnb
            --ref "refs/tags/${CNB_BRANCH}"
            --revision "$CNB_COMMIT"
            --repository "$CNB_REPO_SLUG_LOWERCASE"
