# GitHub Actions. The same script backs CNB and GitLab CI, so the validation
# steps have one definition: scripts/ci-common.mjs.
#
# Images go to GHCR under the repository owner, for example
# ghcr.io/azurekiln2333/azurekiln-qfli-server/qfli-server.
# GITHUB_TOKEN needs `packages: write`; no extra secret is required.
# Pull requests validate only; they never push images.
name: Verify and publish image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: npm
      # The deployment contract check needs a Compose CLI on the runner.
      - name: Require Compose
        run: docker compose version --short
      - name: Validate
        run: node scripts/ci-common.mjs verify

  image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Split so a failure names the exact stage in the job summary. The script
      # still owns the image name and tag rules; --steps narrows the work.
      - name: Re-run validation before publishing
        run: node scripts/ci-common.mjs verify
      - name: Build the image
        run: >-
          node scripts/ci-common.mjs publish
          --platform github
          --ref "${{ github.ref }}"
          --revision "${{ github.sha }}"
          --repository "${{ github.repository }}"
          --no-login
          --steps build
      - name: Push the image and latest
        run: >-
          node scripts/ci-common.mjs publish
          --platform github
          --ref "${{ github.ref }}"
          --revision "${{ github.sha }}"
          --repository "${{ github.repository }}"
          --no-login
          --steps push
